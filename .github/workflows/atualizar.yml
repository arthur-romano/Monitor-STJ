name: Atualizar Monitor STJ

on:
  schedule:
    - cron: "7 10 * * *"      # 07:07 em Brasília (10:07 UTC), todo dia
  workflow_dispatch: {}         # botão para rodar na hora, manualmente

permissions:
  contents: write

concurrency:
  group: monitor-stj
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pandas

      - name: Rodar o coletor
        run: python coletor_stj.py

      - name: Rodar o coletor de noticias
        run: python coletor_noticias.py || echo "coletor de noticias falhou; seguindo sem atualizar as noticias"

      - name: Transformar a tela gerada em index.html
        run: cp monitor_gerado.html index.html

      - name: Enviar as atualizações de volta ao repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Atualizacao automatica - $(date +'%d/%m/%Y %H:%M')" || echo "Nada novo para enviar."
          git push
