name: Atualizar Monitor STJ

on:
  schedule:
    - cron: "7 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-stj
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas

      - name: Rodar o coletor
        run: python coletor_stj.py

      - name: Transformar a tela gerada em index.html
        run: cp monitor_gerado.html index.html

      - name: Enviar as atualizacoes de volta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Atualizacao automatica" || echo "Nada novo."
          git push
